name: Deploy SportLab Pages + Server Snapshot (V11.8.2.4)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 3 refreshes/day. UTC avoids DST ambiguity; the app displays generatedAt locally.
    - cron: "17 5,12,18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "sportlab-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate SportLab
        run: npm run validate
      - name: Build atomic server snapshot
        env:
          SPORTLAB_SNAPSHOT_BUILD: "1"
        run: npm run snapshot
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
