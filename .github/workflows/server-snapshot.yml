name: Refresh Server Snapshot (V11.8.4.8)

on:
  workflow_dispatch:
  schedule:
    # 3 refreshes/day. UTC avoids DST ambiguity; the app displays generatedAt locally.
    - cron: "17 5,12,18 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "sportlab-server-snapshot"
  cancel-in-progress: false

jobs:
  snapshot:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate SportLab
        run: npm run validate
      - name: Build atomic server snapshot
        env:
          SPORTLAB_SNAPSHOT_BUILD: "1"
        run: npm run snapshot
      - name: Publish snapshot to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/server-snapshot.json; then
            echo "Server snapshot unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/server-snapshot.json
          git commit -m "chore(snapshot): refresh server snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy refreshed snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
